<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Interactive Menu - jQuery</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --bg-page: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #818cf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(at 10% 20%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
        }

        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }


        #menuButton {
            display: none;
            background: var(--primary-gradient);
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s;
        }

        #menuButton:active {
            transform: scale(0.95);
        }

       
        #menu {
            display: flex;
            list-style: none;
            gap: 36px;
        }

        #menu li a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
            position: relative;
            transition: color 0.3s;
        }

        #menu li a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background: var(--primary-gradient);
            transition: width 0.3s ease;
        }

        #menu li a:hover,
        #menu li a.active {
            color: var(--text-main);
        }

        #menu li a:hover::after,
        #menu li a.active::after {
            width: 100%;
        }

        
        .content {
            max-width: 650px;
            margin: 60px auto;
            padding: 40px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .content h1 {
            font-size: 28px;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .content p {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .demo-box {
            width: 220px;
            height: 120px;
            background: var(--primary-gradient);
            color: #fff;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-group button {
            padding: 12px 20px;
            border: none;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .btn-group button:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

       
        @media screen and (max-width: 768px) {
            #menuButton {
                display: block; 
            }

            #menu {
                display: none; 
                flex-direction: column;
                width: 100%;
                background: rgba(15, 23, 42, 0.95);
                backdrop-filter: blur(20px);
                position: absolute;
                top: 73px;
                left: 0;
                padding: 24px 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                text-align: center;
                gap: 20px;
            }

            #menu li a {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>


    <header>
        <div class="nav-container">
            <div class="logo">CREATIVE.IO</div>
            
        
            <button id="menuButton">☰ MENU</button>

           
            <ul id="menu">
                <li><a href="#" class="active">HOME</a></li>
                <li><a href="#">PRODUCT</a></li>
                <li><a href="#">SERVICES</a></li>
                <li><a href="#">ABOUT</a></li>
                <li><a href="#">CONTACT</a></li>
            </ul>
        </div>
    </header>


    <section class="content">
        <h1>Hiệu Ứng jQuery Đỉnh Cao</h1>
        <p>Trải nghiệm các phương thức tương tác mượt mà với <code>click()</code>, <code>hide()</code>, <code>show()</code>, <code>toggle()</code>, và <code>slideToggle()</code>.</p>
        
        <div class="demo-box" id="box">Interactive Box</div>

        <div class="btn-group">
            <button id="btnHide">hide()</button>
            <button id="btnShow">show()</button>
            <button id="btnToggle">toggle()</button>
            <button id="btnSlide">slideToggle()</button>
        </div>
    </section>


    <script>
        $(document).ready(function () {
           
            $("#menuButton").click(function () {
                $("#menu").slideToggle(300);
            });

          
            $("#btnHide").click(function () {
                $("#box").hide(300);
            });

            $("#btnShow").click(function () {
                $("#box").show(300);
            });

            $("#btnToggle").click(function () {
                $("#box").toggle(300);
            });

            $("#btnSlide").click(function () {
                $("#box").slideToggle(300);
            });
        });
    </script>

</body>
</html>
